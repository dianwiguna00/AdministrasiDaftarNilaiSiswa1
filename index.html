<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Perpustakaan Sekolah</title>

<style>

body{
    font-family:Arial, sans-serif;
    padding:20px;
    background:#f3f5f8;
}

h2,h3{
    margin:10px 0;
}

.toolbar{
    margin-bottom:10px;
}

input,
button,
select{
    padding:8px;
    font-size:18px;
    margin:3px;
}

button{
    cursor:pointer;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    margin-top:10px;
}

th,
td{
    border:1px solid #ccc;
    padding:8px;
}

th{
    background:#0d6efd;
    color:white;
}

.item-siswa{
    padding:8px;
    border:1px solid #ccc;
    background:white;
    cursor:pointer;
}

.item-siswa:hover{
    background:#eeeeee;
}

#hasilSiswa{
    margin-top:5px;
    margin-bottom:10px;
}

</style>
</head>
<body>

<h2>📚 PERPUSTAKAAN SEKOLAH</h2>

<div class="toolbar">

<select
id="kelasCari"
onchange="cariSiswa()">

<option value="">
Pilih Kelas
</option>

<option>7A</option>
<option>7B</option>
<option>7C</option>
<option>7D</option>
<option>7E</option>
<option>7F</option>
<option>7G</option>
<option>7H</option>
<option>7I</option>

<option>8A</option>
<option>8B</option>
<option>8C</option>
<option>8D</option>
<option>8E</option>
<option>8F</option>
<option>8G</option>
<option>8H</option>
<option>8I</option>

<option>9A</option>
<option>9B</option>
<option>9C</option>
<option>9D</option>
<option>9E</option>
<option>9F</option>
<option>9G</option>
<option>9H</option>
<option>9I</option>

</select>

<input
type="text"
id="cariNama"
placeholder="Cari nama siswa..."
onkeyup="cariSiswa()">

<input
type="date"
id="tanggal">

</div>

<div id="hasilSiswa"></div>

<hr>

<input id="nis" placeholder="NIS" readonly>
<input id="namaSiswa" placeholder="Nama Siswa" readonly>
<input id="kelas" placeholder="Kelas" readonly>

<h3>Pilih Buku Pelajaran</h3>

<table>

<thead>
<tr>
<th>No</th>
<th>Mata Pelajaran</th>
<th>Pilih</th>
</tr>
</thead>

<tbody id="tbody">
</tbody>

</table>

<br>

<button onclick="pinjam()">
📚 Simpan Peminjaman
</button>

<hr>

<h3>Buku Yang Sedang Dipinjam</h3>

<table>

<thead>
<tr>
<th>No</th>
<th>Tanggal Pinjam</th>
<th>Mapel</th>
<th>Aksi</th>
</tr>
</thead>

<tbody id="pinjamanBody">
</tbody>

</table>

<script>

const API =
"https://script.google.com/macros/s/AKfycby_WenAO6SoFmmZk4p_i6FnkudoE_oWXxaJU8Ox-3FljqUnb-2lUAGKUUV5pLaKaCkvdA/exec";

let dataMapel = [];

/* ===================================
   LOAD MAPEL
=================================== */

async function loadMapel(){

    const res =
    await fetch(API + "?mapel=1");

    dataMapel =
    await res.json();

    dataMapel.forEach(m=>{

        m.pilih = false;

    });

    renderMapel();

}

/* ===================================
   TAMPILKAN MAPEL
=================================== */

function renderMapel(){

    let html = "";

    dataMapel.forEach((m,i)=>{

        html += `
        <tr>

        <td>${i+1}</td>

        <td>${m.mapel}</td>

        <td>

        <input
        type="checkbox"
        onchange="pilihMapel(${i},this.checked)">

        </td>

        </tr>
        `;

    });

    document.getElementById("tbody")
    .innerHTML = html;

}

/* ===================================
   PILIH MAPEL
=================================== */

function pilihMapel(i,status){

    dataMapel[i].pilih =
    status;

}

/* ===================================
   CARI SISWA
=================================== */

async function cariSiswa(){

    let kelas =
    document.getElementById(
    "kelasCari"
    ).value;

    if(!kelas){
        return;
    }

    let nama =
    document.getElementById(
    "cariNama"
    ).value;

    const res =
    await fetch(

        API +

        "?kelas=" +

        encodeURIComponent(kelas) +

        "&nama=" +

        encodeURIComponent(nama)

    );

    const data =
    await res.json();

    let html = "";

    data.forEach(s=>{

        html += `

        <div
        class="item-siswa"
        onclick="
        pilihSiswa(
        '${s.nis}',
        '${s.nama}',
        '${s.kelas}'
        )">

        <b>${s.nama}</b><br>

        NIS : ${s.nis}

        </div>

        `;

    });

    document.getElementById(
    "hasilSiswa"
    ).innerHTML =
    html;

}

/* ===================================
   PILIH SISWA
=================================== */

function pilihSiswa(
nis,
nama,
kelas
){

    document.getElementById("nis")
    .value = nis;

    document.getElementById("namaSiswa")
    .value = nama;

    document.getElementById("kelas")
    .value = kelas;

    document.getElementById(
    "hasilSiswa"
    ).innerHTML = "";

    tampilPinjaman(
        nis,
        kelas
    );

}

/* ===================================
   SIMPAN PEMINJAMAN
=================================== */

async function pinjam(){

    let mapelDipilih =
    dataMapel.filter(
        m => m.pilih
    );

    if(!document.getElementById("nis").value){

        alert(
        "Pilih siswa terlebih dahulu"
        );

        return;

    }

    if(mapelDipilih.length===0){

        alert(
        "Pilih mapel"
        );

        return;

    }

    const data = {

        aksi:"pinjam",

        tanggal:
        document.getElementById(
        "tanggal").value,

        nis:
        document.getElementById(
        "nis").value,

        nama:
        document.getElementById(
        "namaSiswa").value,

        kelas:
        document.getElementById(
        "kelas").value,

        mapel:
        mapelDipilih

    };

    await fetch(API,{

        method:"POST",

        body:
        JSON.stringify(data)

    });

    alert(
    "Peminjaman berhasil disimpan"
    );

    tampilPinjaman(
        data.nis,
        data.kelas
    );

}

/* ===================================
   DAFTAR PINJAMAN
=================================== */

async function tampilPinjaman(
nis,
kelas
){

    const res =
    await fetch(

        API +

        "?aksi=riwayat" +

        "&nis=" +

        encodeURIComponent(nis) +

        "&kelas=" +

        encodeURIComponent(kelas)

    );

    const data =
    await res.json();

    let html = "";

    data.forEach((d,i)=>{

        html += `

        <tr>

        <td>${i+1}</td>

        <td>${d.tanggal}</td>

        <td>${d.mapel}</td>

        <td>

        <button
        onclick="
        kembalikanSatu(
            ${d.row},
            '${d.mapel}'
        )">

        Kembalikan

        </button>

        </td>

        </tr>

        `;

    });

    document.getElementById(
    "pinjamanBody"
    ).innerHTML = html;

}

/* ===================================
   KEMBALIKAN SATU BUKU
=================================== */

async function kembalikanSatu(
row,
mapel
){

    if(
        !confirm(
        "Kembalikan buku "
        + mapel +
        " ?"
        )
    ){
        return;
    }

    const data = {

        aksi:
        "kembalikanSatu",

        row:
        row,

        kelas:
        document.getElementById(
        "kelas").value,

        tanggal:
        document.getElementById(
        "tanggal").value

    };

    await fetch(API,{

        method:"POST",

        body:
        JSON.stringify(data)

    });

    tampilPinjaman(

        document.getElementById(
        "nis").value,

        document.getElementById(
        "kelas").value

    );

}

/* ===================================
   ON LOAD
=================================== */

window.onload = function(){

    document.getElementById(
    "tanggal"
    ).value =

    new Date()
    .toISOString()
    .split("T")[0];

    loadMapel();

};

</script>

</body>
</html>
